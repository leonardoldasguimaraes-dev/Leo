<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Placa Banheiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@600;700;800&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:Figtree,Arial,sans-serif;color:#16201B;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;padding:14mm;display:flex;flex-direction:column}

.taxa{margin-top:12mm;background:#C9821A;color:#fff;border-radius:6mm;padding:7mm 12mm;font-family:"Bricolage Grotesque",Arial;font-weight:800;font-size:12mm;line-height:1.1}
.taxa small{display:block;font-family:Figtree,Arial;font-size:6mm;font-weight:700;opacity:.95;margin-top:2mm}
footer{margin-top:10mm;font-size:6mm;font-weight:700;color:#5E6E62}
