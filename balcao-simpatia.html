<title>Balcão Simpatia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tela de balcão para tablet — barra verde com o dia e quem está no caixa, quatro botões grandes de lançamento, formulário curto e a lista do que já foi lançado hoje (sem totais) */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --sunk:#E5EBE3; --line:#D3DCD0; --ink:#17231B; --muted:#5E6E62;
  --brand:#1F4A35; --brand-ink:#EAF4EC; --accent:#D18A1E; --accent-ink:#1F1405; --pos:#1E7F4E; --neg:#B4382F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101814; --surface:#18231D; --sunk:#202D26; --line:#2C3B32; --ink:#E6EEE8; --muted:#9AAAA0;
  --brand:#173827; --brand-ink:#E6F2E9; --accent:#E3A23C; --accent-ink:#1F1405; --pos:#4CC487; --neg:#F07368; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#18231D; --sunk:#202D26; --line:#2C3B32; --ink:#E6EEE8; --muted:#9AAAA0;
  --brand:#173827; --brand-ink:#E6F2E9; --accent:#E3A23C; --accent-ink:#1F1405; --pos:#4CC487; --neg:#F07368; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
html,body,button,input,label{touch-action:manipulation}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em}
.dia{font-size:14px;opacity:.8;text-transform:capitalize}
.quem{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 6px 6px 12px}
.quem label{font-size:13px;opacity:.8}
.quem input{background:transparent;border:0;color:var(--brand-ink);font-weight:700;font-size:16px;width:150px;padding:6px 4px;outline:none}
.quem input::placeholder{color:var(--brand-ink);opacity:.55}
main{display:flex;flex-direction:column;gap:18px;padding-block:18px 40px}
.banner{border-radius:12px;padding:12px 14px;background:var(--sunk);font-weight:600}
.banner.ok{background:color-mix(in srgb,var(--pos) 16%,var(--surface));color:var(--pos)}
.banner.err{background:color-mix(in srgb,var(--neg) 14%,var(--surface));color:var(--neg)}
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tipos{grid-template-columns:repeat(2,1fr)}}
.tipo{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-height:92px}
.tipo b{font-family:var(--display);font-size:19px}
.tipo span{font-size:13px;color:var(--muted)}
.tipo[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.tipo:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-size:20px;margin:0}
.hint{font-size:14px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:18px;width:100%}
.field input.m{font-family:var(--mono);font-size:22px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.btn{border:0;border-radius:12px;padding:16px;font-weight:700;font-size:18px;cursor:pointer;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5}
.lista{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.hora{font-family:var(--mono);font-size:13px;color:var(--muted)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.item .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.fia{background:color-mix(in srgb,var(--neg) 16%,var(--surface));color:var(--neg)}
.del{border:0;background:none;color:var(--muted);font-size:14px;padding:8px;cursor:pointer;border-radius:8px}
.del[data-armed="1"]{background:var(--neg);color:#fff}
.sug{display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow:auto}
.sg{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:baseline;cursor:pointer;font-weight:600}
.sg span{font-family:var(--mono);font-size:14px;color:var(--muted);font-weight:500}
.qtd{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.qtd b{font-family:var(--mono);font-size:22px;min-width:28px;text-align:center}
.qb{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer}
.note{font-size:13px;color:var(--muted)}
.vazio{color:var(--muted);text-align:center;padding:18px 0}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>

<header class="top">
  <div class="wrap">
    <div><h1>Balcão Simpatia</h1><div class="dia" id="dia"></div></div>
    <div class="quem"><label for="quem">No caixa:</label><input id="quem" placeholder="seu nome" autocomplete="off" maxlength="30"></div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="status" hidden></div>

  <div class="tipos" role="group" aria-label="O que lançar">
    <button type="button" class="tipo" data-t="caderno" aria-pressed="true"><b>Balcão</b><span>Venda no balcão: dinheiro ou cartão</span></button>
    <button type="button" class="tipo" data-t="comanda" aria-pressed="false"><b>Comanda</b><span>Mesa paga ou no fiado</span></button>
    <button type="button" class="tipo" data-t="retirada" aria-pressed="false"><b>Retirada</b><span>Gelo e passagens</span></button>
    <button type="button" class="tipo" data-t="cascos" aria-pressed="false"><b>Cascos</b><span>Vazios no fim do turno</span></button>
  </div>

  <form class="card" id="fCaderno" novalidate>
    <h2>Venda no balcão</h2>
    <div class="field"><label>Como pagou</label>
      <div class="chips" id="cadForma" role="group" aria-label="Como pagou">
        <button type="button" class="chip" data-f="din" aria-pressed="true">Dinheiro</button>
        <button type="button" class="chip" data-f="deb" aria-pressed="false">Débito</button>
        <button type="button" class="chip" data-f="cre" aria-pressed="false">Crédito</button>
        <button type="button" class="chip" data-f="pix" aria-pressed="false">Pix</button>
        <button type="button" class="chip" data-f="vou" aria-pressed="false">Voucher</button>
      </div>
    </div>
    <p class="hint" id="cadHint">Dinheiro: anote também no caderno.</p>
    <div class="grid2">
      <div class="field"><label for="cadDesc">O que foi</label><input id="cadDesc" placeholder="digite a 1ª letra: B, A, C…" autocomplete="off"></div>
      <div class="field"><label for="cadVal">Valor (R$)</label><input id="cadVal" class="m din" inputmode="numeric" placeholder="0,00" autocomplete="off"></div>
    </div>
    <div class="sug" id="sug" hidden></div>
    <div class="qtd" id="qtdBox" hidden><span>Quantidade</span><button type="button" class="qb" id="qMenos" aria-label="Diminuir">−</button><b id="qN">1</b><button type="button" class="qb" id="qMais" aria-label="Aumentar">+</button><span class="note" id="qUn"></span></div>
    <button class="btn primary" type="submit" id="cadBtn">Lançar venda</button>
  </form>

  <form class="card" id="fComanda" novalidate hidden>
    <h2>Comanda</h2>
    <div class="field"><label>Cor do bloco</label>
      <div class="chips" id="comCor" role="group" aria-label="Cor da comanda">
        <button type="button" class="chip" data-c="branca" aria-pressed="true">Branca</button>
        <button type="button" class="chip" data-c="amarela" aria-pressed="false">Amarela</button>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label for="comNum">Número da comanda</label><input id="comNum" class="m" inputmode="numeric" placeholder="0002" autocomplete="off"></div>
      <div class="field"><label for="comVal">Valor total (R$)</label><input id="comVal" class="m din" inputmode="numeric" placeholder="0,00" autocomplete="off"></div>
    </div>
    <div class="field"><label>Como pagou</label>
      <div class="chips" id="comForma" role="group" aria-label="Como pagou">
        <button type="button" class="chip" data-f="din" aria-pressed="true">Dinheiro</button>
        <button type="button" class="chip" data-f="cart" aria-pressed="false">Cartão / Pix</button>
        <button type="button" class="chip" data-f="ale" aria-pressed="false">Alelo</button>
        <button type="button" class="chip" data-f="fia" aria-pressed="false">Fiado</button>
      </div>
    </div>
    <div class="field" id="comNomeWrap" hidden><label for="comNome">Nome de quem pegou fiado</label><input id="comNome" placeholder="ex.: Nei" autocomplete="off"></div>
    <button class="btn primary" type="submit">Lançar comanda</button>
  </form>

  <form class="card" id="fRetirada" novalidate hidden>
    <h2>Retirada do caixa</h2>
    <p class="hint">Dinheiro tirado da venda para pagar coisas do restaurante. Guarde a nota do gelo.</p>
    <div class="chips" id="retTipo" role="group" aria-label="Tipo de retirada">
      <button type="button" class="chip" data-f="gelo" aria-pressed="true">Gelo</button>
      <button type="button" class="chip" data-f="pass" aria-pressed="false">Passagem</button>
      <button type="button" class="chip" data-f="outro" aria-pressed="false">Outro</button>
    </div>
    <div class="grid2">
      <div class="field"><label for="retNome" id="retNomeLbl">Observação</label><input id="retNome" placeholder="" autocomplete="off"></div>
      <div class="field"><label for="retVal">Valor (R$)</label><input id="retVal" class="m din" inputmode="numeric" placeholder="0,00" autocomplete="off"></div>
    </div>
    <button class="btn primary" type="submit">Lançar retirada</button>
  </form>

  <form class="card" id="fCascos" novalidate hidden>
    <h2>Cascos vazios</h2>
    <p class="hint">Conte as garrafas vazias nos engradados no fim do turno.</p>
    <div class="grid2">
      <div class="field"><label for="casL">Litrões vazios</label><input id="casL" class="m" inputmode="numeric" placeholder="0" autocomplete="off"></div>
      <div class="field"><label for="cas6">600 ml vazios</label><input id="cas6" class="m" inputmode="numeric" placeholder="0" autocomplete="off"></div>
    </div>
    <button class="btn primary" type="submit">Lançar cascos</button>
  </form>

  <section class="card">
    <h2>Lançado hoje</h2>
    <div class="lista" id="lista"><div class="vazio">Carregando…</div></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const hoje=()=>{ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function money(s){ s=String(s||"").replace(/[^\d,.-]/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:NaN; }
// valor em real: digita só números e a vírgula aparece sozinha (600 vira 6,00)
document.querySelectorAll("input.din").forEach(i=>{ i.addEventListener("input",()=>{ const d=i.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,7); if(!d){ i.value=""; return; } const n=Number(d)/100; i.value=n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }); });
// produtos do bar com preço de venda (do app Simpatia Financeiro)
const PRODUTOS=[["Antarctica litro",13],["Antarctica 600",11],["Antarctica lata 473",10],["Brahma litro",13],["Brahma 600",11],["Brahma lata 473",10],["Skol litro",13],["Skol 600",11],["Budweiser 600",11],["Original 600",13],["Spaten 600",13],["Spaten long neck",10],["Stella Artois 600",13],["Stella Artois long neck",11],["Stella Pure Gold 600",16],["Stella Pure Gold long neck",11],["Corona 600",16],["Heineken 600",16],["Heineken long neck",10],["Heineken Zero long neck",10],["Coca-Cola 200",4],["Coca-Cola Zero 200",4],["Coca-Cola lata 220",5],["Coca-Cola Zero lata 220",5],["Coca-Cola lata 350",8],["Coca-Cola Zero lata 350",8],["Coca-Cola KS 290",7],["Coca-Cola Zero KS 290",7],["Coca-Cola 1L vidro",10],["Coca-Cola Zero 1L",10],["Coca-Cola 2L",16],["Coca-Cola Zero 2L",16],["Guaraná 200",4],["Guaraná Zero 200",5],["H2OH limão 500",8],["Água sem gás 500",4],["Água com gás 500",5],["Água 1,5L",7],["Suco Del Valle lata",7],["Dose de barril (pinga)",3],["Dose de Salinas",3],["Linguiça",7],["Coxinha",3],["Bala",0.30]];
const norm=x=>String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const fmt2=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
let sel=null, cadF="din";
const CADF={din:"Dinheiro",deb:"Débito Sicoob",cre:"Crédito Sicoob",pix:"Pix Sicoob",vou:"Voucher Sicoob"};
$("cadForma").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b) return; cadF=b.dataset.f; [...$("cadForma").children].forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("cadHint").textContent=cadF==="din"?"Dinheiro: anote também no caderno.":"Cartão/Pix na Sicoob: passe na máquina, lance aqui e grampeie a notinha no caderno."; });
function sugere(){ const q=norm($("cadDesc").value).trim(); const box=$("sug");
  if(!q||sel){ box.hidden=true; return; }
  const qs=q.split(/[^a-z0-9]+/).filter(Boolean);
  const hits=PRODUTOS.filter(([n])=>{ const ws=norm(n).split(/[^a-z0-9]+/).filter(Boolean); return ws[0].startsWith(qs[0]) && qs.slice(1).every(t=>ws.slice(1).some(w=>w.startsWith(t))); });
  box.hidden=!hits.length; box.innerHTML=hits.map(([n,pr],i)=>`<button type="button" class="sg" data-p="${PRODUTOS.indexOf(PRODUTOS.find(x=>x[0]===n))}">${esc(n)} <span>${brl.format(pr)}</span></button>`).join(""); }
function aplicaSel(){ if(!sel){ $("qtdBox").hidden=true; return; } $("qtdBox").hidden=false; $("qN").textContent=sel.q; $("qUn").textContent=`${brl.format(sel.p)} cada`;
  $("cadDesc").value=(sel.q>1?`${sel.q}x `:"")+sel.n; $("cadVal").value=fmt2(Math.round(sel.p*sel.q*100)/100); $("sug").hidden=true; }
$("cadDesc").addEventListener("input",()=>{ sel=null; $("qtdBox").hidden=true; sugere(); });
$("sug").addEventListener("click",e=>{ const b=e.target.closest("[data-p]"); if(!b) return; const [n,p]=PRODUTOS[Number(b.dataset.p)]; sel={n,p,q:1}; aplicaSel(); });
$("qMais").onclick=()=>{ if(sel){ sel.q=Math.min(99,sel.q+1); aplicaSel(); } };
$("qMenos").onclick=()=>{ if(sel){ sel.q=Math.max(1,sel.q-1); aplicaSel(); } };
let db=null, movs=[], tipo="caderno", forma="din", cor="branca", retT="gelo", stTimer=null;
const FORMA={din:"Dinheiro",cart:"Cartão/Pix",ale:"Alelo",fia:"Fiado"}, RET={gelo:"Gelo",pass:"Passagem",outro:"Outro"};

function status(msg,kind){ const s=$("status"); s.textContent=msg; s.className="banner"+(kind?" "+kind:""); s.hidden=!msg; clearTimeout(stTimer); if(msg&&kind==="ok") stTimer=setTimeout(()=>{ s.hidden=true; },3500); }
function mostraDia(){ $("dia").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}); }
mostraDia(); setInterval(mostraDia,60000);
try{ $("quem").value=localStorage.getItem("quem")||""; }catch{}
$("quem").addEventListener("input",()=>{ try{ localStorage.setItem("quem",$("quem").value.trim()); }catch{} });

function setTipo(t){ tipo=t; document.querySelectorAll(".tipo").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  $("fCaderno").hidden=t!=="caderno"; $("fComanda").hidden=t!=="comanda"; $("fRetirada").hidden=t!=="retirada"; $("fCascos").hidden=t!=="cascos";
  if(t==="comanda" && !$("comNum").value) $("comNum").value=proxComanda(); }
document.querySelector(".tipos").addEventListener("click",e=>{ const b=e.target.closest("[data-t]"); if(b) setTipo(b.dataset.t); });
$("comForma").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b) return; forma=b.dataset.f; [...$("comForma").children].forEach(x=>x.setAttribute("aria-pressed",x===b)); $("comNomeWrap").hidden=forma!=="fia"; });
function setRet(f){ retT=f; [...$("retTipo").children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===f)); $("retNomeLbl").textContent=f==="pass"?"Quem pegou a passagem":"Observação"; $("retNome").placeholder=f==="pass"?"ex.: Juliana":f==="gelo"?"ex.: 2 sacos":""; }
$("retTipo").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(b) setRet(b.dataset.f); });
setRet("gelo");

const COR={branca:"Branca",amarela:"Amarela"};
const corDe=m=>m.cor||"branca";
$("comCor").addEventListener("click",e=>{ const b=e.target.closest("[data-c]"); if(!b) return; cor=b.dataset.c; [...$("comCor").children].forEach(x=>x.setAttribute("aria-pressed",x===b)); $("comNum").value=proxComanda(); });
function proxComanda(){ const ns=movs.filter(m=>m.tipo==="comanda"&&corDe(m)===cor).map(m=>parseInt(m.numero,10)).filter(n=>n>0); return ns.length?String(Math.max(...ns)+1).padStart(4,"0"):""; }

async function lancar(doc,btn){
  const quem=$("quem").value.trim();
  if(!quem){ status("Escreva seu nome em \"No caixa\" lá em cima antes de lançar.","err"); $("quem").focus(); return false; }
  if(!db){ status("Sem conexão com o app. Confira a internet e abra de novo pelo claude.ai.","err"); return false; }
  btn.disabled=true;
  try{ await db.collection("mov").doc().set({...doc,data:hoje(),quem,criadoEm:Date.now()}); return true; }
  catch(err){ status("Não salvou: "+(err?.message||err?.code||"erro")+". Tente de novo.","err"); return false; }
  finally{ btn.disabled=false; }
}

$("fCaderno").addEventListener("submit",async e=>{ e.preventDefault(); const v=money($("cadVal").value), d=$("cadDesc").value.trim();
  if(!d){ status("Escreva o que foi vendido.","err"); $("cadDesc").focus(); return; }
  if(!(v>0)){ status("Digite o valor.","err"); $("cadVal").focus(); return; }
  if(await lancar({tipo:"caderno",desc:d.slice(0,80),valor:v,forma:cadF},e.submitter||e.target.querySelector("button[type=submit]"))){ $("cadDesc").value=""; $("cadVal").value=""; sel=null; $("qtdBox").hidden=true; $("sug").hidden=true; status(`Venda lançada (${CADF[cadF]}).`,"ok"); $("cadForma").querySelector('[data-f="din"]').click(); $("cadDesc").focus(); } });

$("fComanda").addEventListener("submit",async e=>{ e.preventDefault(); const v=money($("comVal").value), n=$("comNum").value.replace(/\D/g,""), nome=$("comNome").value.trim();
  if(!n){ status("Digite o número da comanda.","err"); $("comNum").focus(); return; }
  if(!(v>0)){ status("Digite o valor da comanda.","err"); $("comVal").focus(); return; }
  if(forma==="fia"&&!nome){ status("No fiado, escreva o nome de quem pegou.","err"); $("comNome").focus(); return; }
  if(movs.some(m=>m.tipo==="comanda"&&corDe(m)===cor&&String(parseInt(m.numero,10))===String(parseInt(n,10)))){ status(`A comanda ${COR[cor].toLowerCase()} ${n} já foi lançada. Confira na lista.`,"err"); return; }
  if(await lancar({tipo:"comanda",cor,numero:n.padStart(4,"0"),valor:v,forma,nome:forma==="fia"?nome.slice(0,40):""},e.submitter||e.target.querySelector("button[type=submit]"))){
    $("comVal").value=""; $("comNome").value=""; $("comNum").value=String(parseInt(n,10)+1).padStart(4,"0"); status(`Comanda ${COR[cor].toLowerCase()} ${n.padStart(4,"0")} lançada.`,"ok"); } });

$("fRetirada").addEventListener("submit",async e=>{ e.preventDefault(); const v=money($("retVal").value), nome=$("retNome").value.trim();
  if(retT==="pass"&&!nome){ status("Escreva quem pegou a passagem.","err"); $("retNome").focus(); return; }
  if(!(v>0)){ status("Digite o valor.","err"); $("retVal").focus(); return; }
  if(await lancar({tipo:"retirada",ret:retT,nome:nome.slice(0,40),valor:v},e.submitter||e.target.querySelector("button[type=submit]"))){ $("retNome").value=""; $("retVal").value=""; status(`${RET[retT]} lançado.`,"ok"); } });

$("fCascos").addEventListener("submit",async e=>{ e.preventDefault(); const l=$("casL").value.replace(/\D/g,""), s=$("cas6").value.replace(/\D/g,"");
  if(l===""&&s===""){ status("Digite quantos cascos vazios tem.","err"); $("casL").focus(); return; }
  if(await lancar({tipo:"cascos",litros:Number(l||0),seiscentos:Number(s||0)},e.submitter||e.target.querySelector("button[type=submit]"))){ $("casL").value=""; $("cas6").value=""; status("Cascos lançados.","ok"); } });

function render(){ const L=movs.filter(m=>m.data===hoje()).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  if(!L.length){ $("lista").innerHTML=`<div class="vazio">Nada lançado hoje ainda. Escolha acima o que lançar.</div>`; return; }
  $("lista").innerHTML=L.map(m=>{ const h=new Date(m.criadoEm||0); const hh=`${pad(h.getHours())}:${pad(h.getMinutes())}`;
    let t="",s="",v="";
    if(m.tipo==="caderno"){ t=esc(m.desc); s=`Balcão · ${(CADF[m.forma]||"Dinheiro")}`; v=brl.format(m.valor); }
    else if(m.tipo==="comanda"){ t=`Comanda ${COR[corDe(m)]} ${esc(m.numero)}`; s=`${m.forma==="fia"?`<span class="tag fia">Fiado</span> ${esc(m.nome)}`:FORMA[m.forma]||""}`; v=brl.format(m.valor); }
    else if(m.tipo==="retirada"){ t=`${RET[m.ret]||"Retirada"}${m.nome?` · ${esc(m.nome)}`:""}`; s="Retirada do caixa"; v=brl.format(m.valor); }
    else if(m.tipo==="cascos"){ t=`Cascos: ${m.litros||0} litrões · ${m.seiscentos||0} de 600`; s="Contagem de vazios"; v=""; }
    return `<div class="item"><span class="hora">${hh}</span><span><span class="t">${t}</span><br><span class="s">${s}${m.quem?` · ${esc(m.quem)}`:""}</span></span><span class="v">${v}</span><button type="button" class="del" data-del="${esc(m.id)}" aria-label="Apagar lançamento">Apagar</button></div>`; }).join("");
}
$("lista").addEventListener("click",async e=>{ const b=e.target.closest("[data-del]"); if(!b||!db) return;
  if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Confirmar"; setTimeout(()=>{ b.dataset.armed=""; b.textContent="Apagar"; },3000); return; }
  try{ await db.collection("mov").doc(b.dataset.del).delete(); status("Lançamento apagado.","ok"); }catch(err){ status("Não apagou: "+(err?.message||err?.code),"err"); } });

(async()=>{
  const timer=setTimeout(()=>{ if(!db) { $("lista").innerHTML=`<div class="vazio">Não consegui conectar. Abra esta página pelo claude.ai, com a conta do bar.</div>`; } },10000);
  try{ db=await window.claude?.use?.("db"); }catch{ db=null; }
  if(!db){ clearTimeout(timer); $("lista").innerHTML=`<div class="vazio">Não consegui conectar. Abra esta página pelo claude.ai, com a conta do bar.</div>`; return; }
  db.collection("mov").onSnapshot(sn=>{ clearTimeout(timer); movs=sn.docs.map(x=>({id:x.id,...x.data()})).filter(m=>m.tipo&&typeof m.data==="string"); render(); if(tipo==="comanda"&&!$("comNum").value) $("comNum").value=proxComanda(); },
    ()=>{ clearTimeout(timer); status("Conexão perdida. Recarregue a página.","err"); });
})();
setInterval(()=>{ if(db) render(); },60000);
</script>
